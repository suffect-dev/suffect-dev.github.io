<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suffect</title>
<meta name="description" content="Suffect lets your AI agent sign up for the services it needs, with you approving the terms and the budget.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ccircle cx='26' cy='32' r='10' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M36 32h20M50 32v8M43 32v6' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#fafaf9; --fg:#111110; --muted:#6b6966; --rule:#e7e5e2; --accent:#111110; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e0d; --fg:#f2f1ee; --muted:#9a9793; --rule:#262523; --accent:#f2f1ee; } }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif; display:flex; flex-direction:column; min-height:100vh; padding:0 16px; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:640px; width:100%; margin:0 auto; padding:64px 0; }
  .mark { display:flex; align-items:center; gap:12px; font-weight:600; letter-spacing:-0.01em; font-size:18px; }
  .mark svg { width:28px; height:28px; }
  h1 { font-size:clamp(28px,6vw,44px); line-height:1.1; letter-spacing:-0.02em; margin:40px 0 16px; font-weight:600; }
  p { margin:0 0 12px; color:var(--muted); font-size:18px; max-width:38ch; }
  .soon { display:inline-block; margin-top:28px; padding:6px 12px; border:1px solid var(--rule); border-radius:999px; font-size:13px; color:var(--muted); }
  footer { max-width:640px; width:100%; margin:0 auto; padding:24px 0 32px; border-top:1px solid var(--rule); font-size:13px; color:var(--muted); display:flex; gap:20px; }
  footer a { color:inherit; text-decoration:none; } footer a:hover { color:var(--fg); }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><circle cx="26" cy="32" r="10" fill="none" stroke="var(--bg)" stroke-width="5"/><path d="M36 32h20M50 32v8M43 32v6" stroke="var(--bg)" stroke-width="5" stroke-linecap="round"/></svg>
    Suffect
  </div>
  <h1>Sign up with your agent.</h1>
  <p>Your agent asks for a service. You approve the terms and the budget once. The keys get ushered in.</p>
  <span class="soon">Coming soon</span>
</main>
<footer>
  <a href="https://github.com/suffect-dev">GitHub</a>
</footer>
</body>
</html>
